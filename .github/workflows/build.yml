name: Build Desktop and Mobile Apps

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Desktop App Dependencies & Build
      run: |
        npm install
        npm run dist

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Presenter-Windows-App
        path: dist/
